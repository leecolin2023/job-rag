name: Merge collected job snapshots

on:
  push:
    branches: [main]
    paths:
      - 'data/data_merge/merge_jobs.py'
      - 'data/collections/**/*.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge latest dated collection folder
        shell: bash
        run: |
          set -euo pipefail
          latest="$(find data/collections -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$latest"
          echo "Merging $latest"
          python data/data_merge/merge_jobs.py --date "$(basename "$latest")"
          python -m unittest discover -s data/data_merge -p 'test_merge_jobs.py'
      - name: Commit canonical jobs.csv
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- data/jobs.csv; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/jobs.csv
            git commit -m 'data: merge latest collected vacancies into jobs.csv'
            git push
          fi
