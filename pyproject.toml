[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-rag"
version = "0.1.0"
description = "Versioned recruitment knowledge base with hybrid retrieval"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "pgvector>=0.3,<1", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "mcp>=1.20,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "numpy>=1.26,<3"]
experiments = ["numpy>=1.26,<3", "tokenizers>=0.20,<1"]

[project.scripts]
job-rag = "job_rag.interfaces.cli:main"
job-rag-mcp = "job_rag.interfaces.mcp_server:main"
job-rag-experiment = "experiments.cli:main"

[tool.setuptools.packages.find]
include = ["job_rag*", "experiments*"]

[tool.setuptools.package-data]
"job_rag.interfaces" = ["static/*.html"]
"experiments" = ["*.md", "*.json", "*.jsonl", "rag-tech-requirements/*.md", "rag-tech-requirements/*.json", "rag-tech-requirements/*.jsonl"]
"*" = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
