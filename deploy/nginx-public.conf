worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    access_log /dev/stdout combined;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    include /etc/jobrag/auth.conf;
    limit_req_zone $binary_remote_addr zone=mcp_requests:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=mcp_connections:10m;

    server {
        listen 8443 ssl;
        ssl_certificate /etc/jobrag/server.crt;
        ssl_certificate_key /etc/jobrag/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;
        client_max_body_size 128k;
        client_body_timeout 15s;
        client_header_timeout 15s;
        keepalive_timeout 30s;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;

        location = /mcp {
            if ($jobrag_authorized = 0) {
                add_header WWW-Authenticate 'Bearer realm="job-rag"' always;
                return 401;
            }
            limit_req zone=mcp_requests burst=15 nodelay;
            limit_req_status 429;
            limit_conn mcp_connections 10;
            proxy_http_version 1.1;
            proxy_set_header Host mcp:8001;
            # The gateway authenticates clients; do not forward the secret to tools.
            proxy_set_header Authorization "";
            proxy_set_header Connection "";
            # No browser/CORS access: MCP clients are server-side harnesses.
            proxy_set_header Origin "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_pass http://mcp:8001/mcp;
        }

        location / { return 404; }
    }
}
