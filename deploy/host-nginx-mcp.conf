# Include ONLY inside this server's existing trusted HTTPS server block.
# Exact location leaves the existing website and all other paths unchanged.
location = /mcp {
    client_max_body_size 128k;
    client_body_timeout 15s;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_name localhost;
    proxy_ssl_server_name on;
    proxy_ssl_trusted_certificate /home/ubuntu/workspaces/job-rag/runtime/public/ca.crt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_pass https://127.0.0.1:8443/mcp;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
}
